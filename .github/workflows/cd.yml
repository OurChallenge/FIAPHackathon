# Nome do workflow
name: CD

# Execução
on:
  # automatico após a conclusão do workflow CI pelo GitHub
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - dev

  # manual pelo GitHub
  workflow_dispatch:

# Permissões necessárias para autenticação OIDC
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Runner Linux
    runs-on: ubuntu-latest

    # Environment configurado no GitHub
    environment: dev

    steps:
      # Baixa o código do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # Login no Azure usando OIDC
      - name: Login no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Autentica o runner no Azure Container Registry
      - name: Login no ACR
        run: az acr login --name acrFiapHackathon

      # Gera a imagem Docker da API
      - name: Build da imagem Docker
        run: |
          docker build \
            -f Hackathon.Api/Dockerfile \
            -t acrfiaphackathon.azurecr.io/fiap-hackathon-api:${{ github.event.workflow_run.head_sha }} \
            .

      # Publica a imagem no ACR
      - name: Push da imagem para o ACR
        run: |
          docker push \
            acrfiaphackathon.azurecr.io/fiap-hackathon-api:${{ github.event.workflow_run.head_sha }}

      - name: Verificar assinatura e recursos
        run: |
          az account show --output table
          az containerapp list --resource-group FIAPHackathon --output table

      # Atualiza o Container App para usar a imagem recém-publicada
      - name: Atualizar Container App
        run: |
          az containerapp update \
            --name fiap-hackathon-api-dev \
            --resource-group FIAPHackathon \
            --image acrfiaphackathon.azurecr.io/fiap-hackathon-api:${{ github.event.workflow_run.head_sha }}