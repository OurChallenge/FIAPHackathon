name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

  # Permite execução manual
  workflow_dispatch:

jobs:
  build:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # Instala o SDK utilizado pela solução
      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restaura os pacotes NuGet
      - name: Restaurar dependencias
        run: dotnet restore FIAPHackathon.slnx

      # Compila toda a solução
      - name: Compilar solucao
        run: dotnet build FIAPHackathon.slnx --configuration Release --no-restore

      # Executa os testes automatizados
      - name: Executar testes
        run: dotnet test FIAPHackathon.slnx --configuration Release --no-build