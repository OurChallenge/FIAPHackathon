apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-web
  namespace: fiap-hackathon

spec:
  replicas: 1

  selector:
    matchLabels:
      app: zabbix-web

  template:
    metadata:
      labels:
        app: zabbix-web

    spec:
      containers:
        - name: zabbix-web
          image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4.12

          ports:
            - containerPort: 8080

          env:
            - name: ZBX_SERVER_HOST
              value: "zabbix-server"

            - name: ZBX_SERVER_PORT
              value: "10051"

            - name: ZBX_SERVER_NAME
              value: "FIAP Hackathon"

            - name: DB_SERVER_HOST
              value: "zabbix-postgres"

            - name: DB_SERVER_PORT
              value: "5432"

            - name: POSTGRES_DB
              value: "zabbix"

            - name: POSTGRES_USER
              value: "zabbix"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiap-hackathon-secret
                  key: Zabbix__PostgresPassword

            - name: PHP_TZ
              value: "America/Sao_Paulo"

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10