apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-server
  namespace: fiap-hackathon

spec:
  replicas: 1

  selector:
    matchLabels:
      app: zabbix-server

  template:
    metadata:
      labels:
        app: zabbix-server

    spec:
      containers:
        - name: zabbix-server
          image: zabbix/zabbix-server-pgsql:alpine-7.4.12

          ports:
            - containerPort: 10051

          env:
            - name: DB_SERVER_HOST
              value: "zabbix-postgres"

            - name: DB_SERVER_PORT
              value: "5432"

            - name: POSTGRES_DB
              value: "zabbix"

            - name: POSTGRES_USER
              value: "zabbix"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiap-hackathon-secret
                  key: Zabbix__PostgresPassword

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            tcpSocket:
              port: 10051
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-server
  namespace: fiap-hackathon

spec:
  selector:
    app: zabbix-server

  ports:
    - protocol: TCP
      port: 10051
      targetPort: 10051

  type: ClusterIP