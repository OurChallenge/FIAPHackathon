apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fiap-hackathon

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: grafana-datasource
    files:
      - prometheus.yaml=provisioning/datasources/prometheus.yaml

  - name: grafana-dashboard-provider
    files:
      - dashboard-provider.yaml=provisioning/dashboards/dashboard-provider.yaml

  - name: grafana-dashboard
    files:
      - fiap-hackathon-api.json=dashboards/fiap-hackathon-api.json