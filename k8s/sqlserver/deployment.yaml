apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: fiap-hackathon

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sqlserver

  template:
    metadata:
      labels:
        app: sqlserver

    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest

          ports:
            - containerPort: 1433

          env:
            - name: ACCEPT_EULA
              value: "Y"

            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiap-hackathon-secret
                  key: SqlServer__SaPassword

          volumeMounts:
            - name: sqlserver-data
              mountPath: /var/opt/mssql

      volumes:
        - name: sqlserver-data
          persistentVolumeClaim:
            claimName: sqlserver-data