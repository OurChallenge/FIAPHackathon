apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fiap-hackathon

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "hackathon-api"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "hackathon-api:8080"